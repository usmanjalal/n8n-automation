version: '3.8'

services:
  fb-scraper:
    build:
      context: ./fb-scraper-service
      dockerfile: Dockerfile
    container_name: fb-scraper-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
    networks:
      - monitor-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-server
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Karachi
      - TZ=Asia/Karachi
    volumes:
      - ~/.n8n:/home/node/.n8n
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge
